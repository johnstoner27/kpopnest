</nav>						<article>
    <h1>Search Wallpapers</h1>

    <p>Search across our wallpaper collection by title or keyword.</p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search wallpapers..."
            autocomplete="off">

        <button id="searchButton">Search</button>
    </div>

    <p id="searchInfo">Loading wallpaper index...</p>

    <div id="results"></div>
</article>

<style>
.search-box{
    display:flex;
    gap:10px;
    margin:25px 0;
}

.search-box input{
    flex:1;
    padding:12px 14px;
    border-radius:6px;
    border:1px solid #333;
    background:#181818;
    color:#fff;
}

.search-box button{
    padding:12px 20px;
    background:#e91e63;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.search-result{
    padding:16px 0;
    border-bottom:1px solid #2b2b2b;
}

.search-result h3{
    margin-bottom:6px;
}

.search-result small{
    color:#999;
}
</style>

<script>
let searchData = [];

async function loadIndex() {
    const res = await fetch('search-index.json');
    searchData = await res.json();

    document.getElementById('searchInfo').textContent =
        searchData.length + ' wallpapers indexed.';
}

function performSearch() {
    const q = document.getElementById('searchInput')
        .value
        .trim()
        .toLowerCase();

    const results = document.getElementById('results');

    if (!q) {
        results.innerHTML = '';
        return;
    }

    const matched = searchData.filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.keyword.toLowerCase().includes(q)
    );

    if (!matched.length) {
        results.innerHTML =
            '<p>No wallpapers found.</p>';
        return;
    }

    results.innerHTML = matched.map(item => `
        <div class="search-result">
            <h3><a href="${item.url}">${item.title}</a></h3>
            <small>${item.keyword}</small>
        </div>
    `).join('');
}

document.getElementById('searchButton')
    .addEventListener('click', performSearch);

document.getElementById('searchInput')
    .addEventListener('keyup', e => {
        if (e.key === 'Enter') performSearch();
    });

loadIndex();
</script>
